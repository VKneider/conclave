<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conclave — Decisiones en equipo</title>
    <meta name="description" content="Conclave — toma decisiones grupales sin reuniones eternas: votaciones, asignaciones, rankings y lluvias de ideas. Cada quien responde por su cuenta y después comparan para decidir juntos. Todo en tu navegador, sin servidor." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://conclave.vkneider.dev" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/images/icon-192x192.png" />
    <meta name="theme-color" content="#FF6B5B" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Conclave — Decisiones en equipo" />
    <meta property="og:description" content="Votaciones, asignaciones, rankings y lluvias de ideas — cada quien responde por su cuenta y comparen para decidir juntos." />
    <meta property="og:url" content="https://conclave.vkneider.dev" />
    <meta property="og:image" content="https://conclave.vkneider.dev/images/og-image.png" />
    <script>
      (() => {
        const defaultTheme = 'Light';
        let themeName = defaultTheme;
        try {
          const savedTheme = localStorage.getItem('sliceTheme');
          if (savedTheme) themeName = savedTheme;
        } catch (_) {
          themeName = defaultTheme;
        }

        document.documentElement.setAttribute('data-slice-theme', themeName);

        try {
          const cachedThemeCss = localStorage.getItem(`sliceTheme-${themeName}`);
          if (cachedThemeCss) {
            const style = document.createElement('style');
            style.id = 'slice-theme-boot';
            style.textContent = cachedThemeCss;
            document.head.appendChild(style);
            return;
          }
        } catch (_) {
          // Ignore storage errors and fall back to direct theme stylesheet load.
        }

        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = `/Themes/${themeName}.css`;
        link.setAttribute('data-slice-theme-boot', 'true');
        document.head.appendChild(link);
      })();
    </script>
    <link rel="stylesheet" type="text/css" href="/App/style.css" />
  </head>

  <body>
    <div id="app">
      <script src="/App/index.js" type="module"></script>
    </div>
  </body>
</html>
