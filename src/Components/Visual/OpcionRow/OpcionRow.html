<div class="opc-row">
  <div class="opc-row__main">
    <input class="opc-row__select" type="checkbox" aria-label="Seleccionar opción" />
    <span class="opc-row__fijo-tag" hidden title="Fija — no entra en el reparto general"></span>
    <div class="opc-row__name-slot"></div>
    <button class="btn btn-ghost opc-row__toggle" type="button">▸ Detalles</button>
    <button class="btn btn-ghost opc-row__remove" type="button" title="Eliminar opción">✕</button>
  </div>
  <div class="opc-row__extra" hidden>
    <div class="opc-row__atributos"></div>
    <div class="opc-row__rolfijo-slot"></div>
    <div class="opc-row__fijo-slot"></div>
  </div>
</div>
