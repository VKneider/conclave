<div class="slice-tour-overlay" popover="manual" data-mode="modal">
   <div class="slice-tour-overlay__dim" aria-hidden="true"></div>
   <div class="slice-tour-overlay__spotlight" aria-hidden="true"></div>
   <section class="slice-tour-overlay__card" role="dialog" tabindex="-1">
      <div class="slice-tour-overlay__close"></div>
      <div class="slice-tour-overlay__panel">
         <p class="slice-tour-overlay__progress"></p>
         <h3 class="slice-tour-overlay__title"></h3>
         <div class="slice-tour-overlay__content"></div>
         <p class="slice-tour-overlay__status" role="status"></p>
         <div class="slice-tour-overlay__actions">
            <div class="slice-tour-overlay__skip"></div>
            <div class="slice-tour-overlay__back"></div>
            <div class="slice-tour-overlay__next"></div>
         </div>
      </div>
      <span class="slice-tour-overlay__arrow" aria-hidden="true"></span>
   </section>
   <div class="slice-tour-overlay__announcement" role="status" aria-live="polite" aria-atomic="true"></div>
</div>
