<div class="respuestas-view">
  <div class="av-header">
    <div class="viewheader-slot"></div>
    <div class="av-header__actions" data-el="exportSlot"></div>
  </div>
  <div class="av-bienvenida" data-el="bienvenida" hidden>
    <div class="av-bienvenida__head">
      <button class="av-bienvenida__toggle" type="button" data-el="bienvenidaToggle" aria-expanded="false">
        <span class="av-bienvenida__icon" data-el="bienvenidaIcon"></span>
        <span class="av-bienvenida__title" data-el="bienvenidaTitle"></span>
        <span class="av-bienvenida__action" data-el="bienvenidaAction">Ver</span>
      </button>
      <button class="av-bienvenida__dismiss" type="button" data-el="bienvenidaDismiss" title="Ocultar este mensaje" aria-label="Ocultar este mensaje">✕</button>
    </div>
    <div class="av-bienvenida__body" data-el="bienvenidaBody" hidden></div>
  </div>
  <div class="av-progress" data-el="progress" hidden>
    <div class="av-progress__track"><span data-el="progressBar"></span></div>
    <span class="av-progress__label" data-el="progressLabel"></span>
  </div>
  <div class="av-next" data-el="nextSection" hidden>
    <div class="av-next__banner">
      <span class="av-next__text" data-el="nextText"></span>
      <div data-el="nextBtnSlot"></div>
    </div>
  </div>
  <div data-el="emptySlot"></div>
  <div class="av-kind-tabs" hidden></div>
  <div class="av-mode-tabs" hidden></div>
  <div class="av-notice" data-el="kindNotice" hidden>
    <span class="av-notice__icon" data-el="kindNoticeIcon"></span>
    <span data-el="kindNoticeText"></span>
  </div>
  <div class="av-slots">
    <div data-slot="carousel"></div>
    <div data-slot="board" hidden></div>
    <div data-slot="votacion" hidden></div>
    <div data-slot="ranking" hidden></div>
    <div data-slot="texto" hidden></div>
  </div>
</div>
