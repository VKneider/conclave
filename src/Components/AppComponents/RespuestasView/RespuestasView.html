<div class="respuestas-view">
  <div class="av-header">
    <h2 class="view-title">Mis respuestas</h2>
    <div class="av-header__actions" data-el="exportSlot"></div>
  </div>
  <div class="av-progress" data-el="progress" hidden>
    <div class="av-progress__track"><span data-el="progressBar"></span></div>
    <span class="av-progress__label" data-el="progressLabel"></span>
  </div>
  <div class="av-next" data-el="nextSection" hidden>
    <div class="av-next__banner">
      <span class="av-next__text" data-el="nextText"></span>
      <div data-el="nextBtnSlot"></div>
    </div>
  </div>
  <div class="av-empty" hidden>
    <div class="av-empty__icon">🗂️</div>
    <h3>Todavía no hay nada que responder</h3>
    <p>Tu Plantilla todavía no tiene nada para responder — ni Opciones para asignar, ni Temas de votación o texto libre. Ve a Plantilla para armarla.</p>
    <button class="btn btn-primary" data-el="goPlantilla">📐 Ir a Plantilla</button>
  </div>
  <div class="av-kind-tabs" hidden></div>
  <div class="av-mode-tabs" hidden></div>
  <div class="av-slots">
    <div data-slot="carousel"></div>
    <div data-slot="board" hidden></div>
    <div data-slot="votacion" hidden></div>
    <div data-slot="ranking" hidden></div>
    <div data-slot="texto" hidden></div>
  </div>
</div>
