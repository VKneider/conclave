<div class="user-menu">
  <button class="user-menu__trigger" type="button" aria-haspopup="true" aria-expanded="false" title="Tu cuenta">
    <span class="user-menu__avatar" data-el="avatar"></span>
  </button>
  <div class="user-menu__panel" data-el="panel" hidden>
    <div class="user-menu__field-slot" data-el="autorFieldSlot"></div>
    <div class="user-menu__field-slot" data-el="emailFieldSlot"></div>
    <div class="user-menu__divider"></div>
    <div class="user-menu__theme-slot" data-el="themeSlot"></div>
    <div class="user-menu__divider"></div>
    <p class="user-menu__section-label">Mis Respuestas</p>
    <span data-el="shareBtnSlot"></span>
    <span data-el="importBtnSlot"></span>
    <input type="file" class="user-menu__file" data-el="importFile" accept="application/json,.json,.plantilla,.respuestas" hidden />
    <span data-el="resetBtnSlot"></span>
    <p class="user-menu__hint">Comparte o exporta tus respuestas; impórtalas para continuar en otro dispositivo.</p>
    <div class="user-menu__divider"></div>
    <p class="user-menu__section-label">Backup</p>
    <span data-el="backupExportBtnSlot"></span>
    <div class="user-menu__divider"></div>
    <p class="user-menu__version" data-el="version"></p>
  </div>
</div>
