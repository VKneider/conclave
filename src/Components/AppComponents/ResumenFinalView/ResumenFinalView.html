<div class="resumen-view">
  <h2 class="view-title">Resumen del consenso final</h2>
  <p class="view-sub">Todas las decisiones finales — asignaciones, votos, rankings y textos adoptados — en un solo vistazo.</p>
  <div class="rf-toolbar">
    <span id="exportHtmlBtnSlot"></span>
    <span id="exportPrintBtnSlot"></span>
    <span id="jsonDropDownSlot"></span>
    <input type="file" id="importJsonFile" accept="application/json,.json" hidden />
  </div>
  <div id="resumenContent"></div>

  <button class="rf-notes-fab" type="button" data-notes-fab title="Notas de la comparación">📝</button>
  <div class="rf-notes-overlay" data-notes-overlay hidden>
    <div class="rf-notes-panel">
      <div class="rf-notes-head">
        <h3 class="rf-notes-title">📝 Notas de la comparación</h3>
        <button class="rf-notes-close" type="button" data-notes-close>✕</button>
      </div>
      <textarea class="rf-notes-textarea" data-notes-textarea placeholder="Escribí tus observaciones, acuerdos o dudas a medida que comparás las respuestas…"></textarea>
      <div class="rf-notes-foot"><span class="rf-notes-status"></span></div>
    </div>
  </div>
</div>
